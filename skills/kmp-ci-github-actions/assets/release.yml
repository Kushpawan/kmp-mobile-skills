# Release workflow for a Kotlin Multiplatform app (Android + iOS).
# Copy to .github/workflows/release.yml. Pairs with the Fastfile from the mobile-release skill.
#
# Triggers:
#   - push of an app tag: android-vX.Y.Z  -> Android job; ios-vX.Y.Z -> iOS job
#   - manual run (Actions tab) with a platform choice
#
# Every signing secret is read ONLY here, and only through the `release` environment.
# Create it under Settings > Environments, add required reviewers, restrict it to tags and the
# default branch, and store these secrets on the environment (not the repository):
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#            ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
#   iOS:     ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64, MATCH_PASSWORD,
#            MATCH_GIT_BASIC_AUTHORIZATION

name: Release

on:
  push:
    tags:
      - 'android-v*'
      - 'ios-v*'
  workflow_dispatch:
    inputs:
      platform:
        description: App to build and upload
        type: choice
        options: [android, ios]
        required: true

# Never cancel a release mid-upload; queue instead.
concurrency:
  group: release-${{ github.ref }}-${{ inputs.platform || 'tag' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  JAVA_VERSION: '21'   # TODO: match ci.yml and the project's toolchain

jobs:
  android:
    if: ${{ startsWith(github.ref, 'refs/tags/android-v') || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app.versionName
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          expected="${GITHUB_REF_NAME#android-v}"
          actual=$(sed -nE 's/^app\.versionName=(.*)$/\1/p' gradle.properties)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.versionName=$actual in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true   # a release build never writes the shared cache

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true     # needs Gemfile + Gemfile.lock with fastlane; reads .ruby-version

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build and upload to Play internal track
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android internal

      # Keep the bundle and the R8 mapping: the mapping deobfuscates production stack traces.
      - name: Upload release outputs
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            **/build/outputs/bundle/**/*.aab
            **/build/outputs/mapping/**/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.jks"

  ios:
    if: ${{ startsWith(github.ref, 'refs/tags/ios-v') || inputs.platform == 'ios' }}
    runs-on: macos-latest
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app.versionName
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          expected="${GITHUB_REF_NAME#ios-v}"
          actual=$(sed -nE 's/^app\.versionName=(.*)$/\1/p' gradle.properties)
          if [ "$expected" != "$actual" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app.versionName=$actual in gradle.properties"
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'   # TODO: pin the exact Xcode the team ships App Store builds with

      # Xcode's build phase runs Gradle to build the Kotlin framework, so the JDK must be on PATH.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Read Kotlin version
        id: kotlin
        run: |
          version=$(sed -nE 's/^kotlin[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore Kotlin/Native toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane ios beta

      # Keep the dSYMs: without them, iOS crash reports for this build cannot be symbolicated.
      - name: Upload release outputs
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: |
            build/ios/*.ipa
            build/ios/*.dSYM.zip
          if-no-files-found: error
          retention-days: 30
