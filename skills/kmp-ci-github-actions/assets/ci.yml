# Pull-request and main-branch CI for a Kotlin Multiplatform app (Android + iOS).
# Copy to .github/workflows/ci.yml, then replace every TODO with the project's real
# module paths and task names (list them with: ./gradlew :shared:tasks --all).
#
# Layout:
#   android - Linux: shared/common compile, Android host tests, lint, debug assemble, Kover
#   ios     - macOS arm64: iOS framework link + iosSimulatorArm64Test
#   ios-x64 - optional macOS Intel: iosX64Test, enabled by the repo variable RUN_IOS_X64=true
#
# No secrets are used here. Signing lives only in release.yml.

name: CI

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

# One run per PR (or per branch). New pushes cancel the older PR run; main runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # TODO: match the project's JDK (kotlin { jvmToolchain(N) }, .java-version, or the team's IDE JDK).
  JAVA_VERSION: '21'

jobs:
  android:
    name: Common + Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          # No `cache: gradle` here: setup-gradle below owns Gradle caching.

      - uses: gradle/actions/setup-gradle@v6
        with:
          # `basic` = MIT-licensed provider built on actions/cache, free for all repositories.
          # Remove this line to use the default `enhanced` provider (closed-source component under
          # Gradle's Terms of Use; free for public repositories). Decide once, per organisation.
          cache-provider: basic

      # One Gradle invocation: configuration runs once. `--continue` reports every failing task.
      # TODO: replace module paths and task names with the project's own.
      - name: Compile, test, lint, assemble
        run: >
          ./gradlew --continue
          :shared:compileCommonMainKotlinMetadata
          :shared:testAndroidHostTest
          :androidApp:lintDebug
          :androidApp:assembleDebug

      # Remove this step if the project does not apply the Kover plugin.
      - name: Coverage report (Kover)
        if: ${{ !cancelled() }}
        run: ./gradlew :shared:koverXmlReport

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-android
          path: |
            **/build/reports/tests/
            **/build/test-results/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kover-report
          path: '**/build/reports/kover/'
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS (arm64 simulator)
    runs-on: macos-latest   # arm64. Pin (e.g. macos-26) if a runner-image change breaks the build.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          # TODO: pin the Xcode version the team uses locally, e.g. '26.0'.
          xcode-version: latest-stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # The Kotlin/Native toolchain (~/.konan) is downloaded per Kotlin version and is large.
      # Key the cache on that version so a Kotlin bump starts a fresh entry.
      - name: Read Kotlin version
        id: kotlin
        run: |
          version=$(sed -nE 's/^kotlin[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # TODO: replace module paths with the project's own.
      - name: Link iOS framework and run iOS simulator tests
        run: >
          ./gradlew --continue
          :shared:linkDebugFrameworkIosSimulatorArm64
          :shared:iosSimulatorArm64Test

      # Optional: build the Xcode host app too. Catches Swift-side breakage from a changed Kotlin API.
      # - name: Build iOS app
      #   run: >
      #     xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
      #     -configuration Debug -destination 'generic/platform=iOS Simulator'
      #     CODE_SIGNING_ALLOWED=NO build

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ios-x64:
    name: iOS (x86_64 simulator)
    # Only for teams that must ship or test x86_64 simulator slices (for example, a test farm of
    # Intel Macs). Enable with a repository variable: Settings > Variables > RUN_IOS_X64 = true.
    # GitHub has announced the end of Intel macOS runners after the macOS 15 image retires.
    if: ${{ vars.RUN_IOS_X64 == 'true' }}
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Read Kotlin version
        id: kotlin
        run: |
          version=$(sed -nE 's/^kotlin[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' gradle/libs.versions.toml | head -n 1)
          echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      - name: Run iOS x86_64 simulator tests
        run: ./gradlew --continue :shared:iosX64Test

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios-x64
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
